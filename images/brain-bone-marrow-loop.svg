<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 64 640 360" role="img" aria-labelledby="t d" font-family="'Source Sans 3', 'Source Sans Pro', Helvetica, Arial, sans-serif">
  <title id="t">A two-way loop between the bone marrow and the brain</title>
  <desc id="d">Blood-forming stem cells in the bone marrow make monocytes that travel through the blood and can settle in the brain as microglia-like cells. Signals from the diseased brain, such as type I interferon, may travel back and disturb monocyte production. From about age 50 to 80, the share of brain microglia derived from the bone marrow rises.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2b2d"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8285f"/>
    </marker>
    <symbol id="glia" viewBox="-14 -14 28 28">
      <g stroke="#23744a" stroke-width="2.2" stroke-linecap="round" fill="none">
        <path d="M0,0 L9,-7 M9,-7 L12,-11 M9,-7 L13,-4"/>
        <path d="M0,0 L-8,-8 M-8,-8 L-12,-9"/>
        <path d="M0,0 L-9,6 M-9,6 L-12,11 M-9,6 L-13,3"/>
        <path d="M0,0 L7,9 M7,9 L11,12"/>
      </g>
      <circle r="4.2" fill="#23744a"/>
    </symbol>
  </defs>

  <rect y="64" width="640" height="360" fill="#ffffff"/>

  <!-- bone marrow -->
  <rect x="24" y="96" width="180" height="170" rx="26" fill="#f6eef2" stroke="#d9b7c6" stroke-width="1.5"/>
  <text x="114" y="128" text-anchor="middle" font-size="21" font-weight="600" fill="#1f2b2d">Bone marrow</text>
  <text x="114" y="150" text-anchor="middle" font-size="16.5" fill="#5b6a6c">skull, long bones</text>
  <g fill="#ffffff" stroke="#b8285f" stroke-width="1.8">
    <circle cx="74" cy="190" r="13"/>
    <circle cx="112" cy="206" r="13"/>
    <circle cx="150" cy="186" r="13"/>
  </g>
  <g fill="#b8285f"><circle cx="74" cy="190" r="4"/><circle cx="112" cy="206" r="4"/><circle cx="150" cy="186" r="4"/></g>
  <text x="114" y="248" text-anchor="middle" font-size="16.5" fill="#5b6a6c">stem cells</text>

  <!-- brain -->
  <path d="M470,96 C420,96 396,128 404,160 C380,172 382,214 410,226 C410,256 448,272 476,262 C500,280 548,276 560,250 C596,248 616,214 600,186 C620,160 600,120 568,118 C552,92 500,84 470,96 Z" fill="#eef5f0" stroke="#a9cdb6" stroke-width="1.5"/>
  <text x="506" y="128" text-anchor="middle" font-size="21" font-weight="600" fill="#1f2b2d">Brain</text>
  <use href="#glia" x="446" y="160" width="30" height="30"/>
  <use href="#glia" x="500" y="178" width="30" height="30"/>
  <use href="#glia" x="548" y="150" width="30" height="30"/>
  <use href="#glia" x="470" y="214" width="30" height="30"/>
  <use href="#glia" x="534" y="214" width="30" height="30"/>
  <text x="506" y="300" text-anchor="middle" font-size="16.5" fill="#5b6a6c">microglia</text>

  <!-- forward arrow: monocytes -->
  <path d="M212,160 C270,128 330,128 392,150" fill="none" stroke="#1f2b2d" stroke-width="2" marker-end="url(#ah)"/>
  <g fill="#ffffff" stroke="#23744a" stroke-width="1.8"><circle cx="268" cy="138" r="7"/><circle cx="300" cy="132" r="7"/><circle cx="332" cy="134" r="7"/></g>
  <text x="300" y="110" text-anchor="middle" font-size="18" fill="#1f2b2d">monocytes travel</text>
  <text x="300" y="90" text-anchor="middle" font-size="18" fill="#1f2b2d">in the blood</text>

  <!-- return arrow: signals -->
  <path d="M400,236 C340,268 280,268 214,236" fill="none" stroke="#b8285f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#am)"/>
  <text x="306" y="288" text-anchor="middle" font-size="18" fill="#b8285f">signals from the diseased brain,</text>
  <text x="306" y="310" text-anchor="middle" font-size="18" fill="#b8285f">e.g. type I interferon?</text>

  <!-- age bar -->
  <text x="320" y="350" text-anchor="middle" font-size="18" fill="#1f2b2d">Share of microglia made in the bone marrow</text>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#e3efe7"/>
      <stop offset="1" stop-color="#23744a"/>
    </linearGradient>
  </defs>
  <rect x="120" y="366" width="400" height="16" rx="8" fill="url(#g)"/>
  <text x="120" y="406" font-size="16.5" fill="#5b6a6c">age 50: a few percent</text>
  <text x="520" y="406" text-anchor="end" font-size="16.5" fill="#5b6a6c">age 80: nearly all</text>
</svg>
